# Git for Windows 钩子由原生 MSYS sh 执行：它启动的 npm 进程的 PATH 会被
# 截断成 MSYS 系统路径，导致 npm 执行 workspace 脚本时找不到 node。
# 这里把 node 所在目录前置回 PATH，并清空 MSYSTEM 让 npm 走 Windows 模式。
pre-commit:
  parallel: true
  jobs:
    - name: format
      env:
        MSYSTEM: ""
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "package-lock.json"
        - "**/package-lock.json"
      run: "PATH=/d/node.js:$PATH npm.cmd run format:check:files -- {staged_files}"
    - name: lint
      env:
        MSYSTEM: ""
      glob: "*.{js,jsx,ts,tsx}"
      run: "PATH=/d/node.js:$PATH npm.cmd run lint -- {staged_files}"
    - name: typecheck
      env:
        MSYSTEM: ""
      run: "PATH=/d/node.js:$PATH npm.cmd run typecheck"

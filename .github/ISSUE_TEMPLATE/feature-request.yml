name: 功能建议
description: 为 Paseo 二开版提出功能或交互改进。
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 请说明使用场景和当前遇到的困难，提交前先搜索已有建议。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望如何改进
      description: 可以附草图、截图或其他应用的交互示例。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已尝试的替代方式

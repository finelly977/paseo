name: 问题反馈
description: 报告 Paseo 二开版的故障或显示问题。
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        这里是 finelly977/paseo 独立二开版的问题反馈。提交前请搜索已有问题，并确认所用版本来自本仓库。
        界面问题请附截图或录屏，日志请先移除密码、令牌等敏感内容。
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 实际发生了什么，预期应该如何？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: input
    id: paseo-version
    attributes:
      label: Paseo 版本
      description: 在“设置 → 关于”查看，或运行 paseo --version。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与客户端
      placeholder: Windows 11，桌面版；Ubuntu，网页端
  - type: input
    id: provider
    attributes:
      label: 智能体及版本
      placeholder: Codex、Claude Code 等；与智能体无关可留空
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 守护进程日志位于 ~/.paseo/daemon.log；请保留故障前后的原始内容。
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
